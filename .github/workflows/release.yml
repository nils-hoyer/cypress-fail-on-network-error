name: Release

on:
    push:
        branches: [main]

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - name: Check for an existing release
              id: version
              run: |
                  version=$(node -p 'require("./package.json").version')
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
                      echo "Tag $version exists: nothing to release."
                      echo "released=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Node LTS
              if: steps.version.outputs.released != 'true'
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'
            - name: Update npm for trusted publishing
              if: steps.version.outputs.released != 'true'
              run: |
                  if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm -v)"; then
                      npm install -g npm@latest
                  fi
                  npm -v
            - if: steps.version.outputs.released != 'true'
              run: npm ci
            - if: steps.version.outputs.released != 'true'
              run: npm run verify
            - name: Publish to npm
              if: steps.version.outputs.released != 'true'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if [ -n "$(npm view "cypress-fail-on-network-error@$VERSION" version)" ]; then
                      echo "$VERSION is already on npm."
                  else
                      npm publish
                  fi
            - name: Create the GitHub release
              if: steps.version.outputs.released != 'true'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$VERSION" --target "$GITHUB_SHA" --generate-notes
