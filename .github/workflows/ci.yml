name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Node LTS
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: 'npm'
            - run: npm ci
            - run: npm run verify

    version:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check the version bump
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  git fetch --depth=1 origin "$BASE_REF"
                  base=$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
                  head=$(node -p 'require("./package.json").version')
                  node .github/scripts/check-version.cjs "$base" "$head"
