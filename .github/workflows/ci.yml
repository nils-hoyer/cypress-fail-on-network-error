name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # the Release workflow runs CI before it releases
    workflow_call:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            # one browser failing should not hide the results of the others
            fail-fast: false
            matrix:
                # electron is Cypress's default browser; the runner image has
                # Chrome and Firefox
                browser: [chrome, electron, firefox]
        name: build (${{ matrix.browser }})
        steps:
            - uses: actions/checkout@v7
            - name: Node LTS
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: 'npm'
            - run: npm ci
            - run: npm run verify
              env:
                  BROWSER: ${{ matrix.browser }}
