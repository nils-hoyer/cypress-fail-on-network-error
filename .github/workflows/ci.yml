name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # the Release workflow runs CI before it releases
    workflow_call:

jobs:
    build:
        runs-on: ubuntu-latest
        # Cypress reports requests differently in Chrome and Firefox; Electron
        # is deprecated as a test browser since Cypress 16
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome, firefox]
        env:
            BROWSER: ${{ matrix.browser }}
        steps:
            - uses: actions/checkout@v7
            - name: Node LTS
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: 'npm'
            - run: npm ci
            - run: npm run verify
